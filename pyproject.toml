[project]
name = "lexiassist"
version = "0.1.0"
description = "Handwriting-based screening indicator for possible dyslexia-related patterns"
readme = "README.md"
requires-python = ">=3.11.15"
dependencies = [
    "requests>=2.34.2",
    "streamlit",
    "torch",
    "torchvision",
    "grad-cam",
    "opencv-python-headless",
    "pillow",
    "numpy",
]

# CPU-only PyTorch wheels (much smaller than the default CUDA build)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
